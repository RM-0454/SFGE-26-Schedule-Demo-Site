name: Build and Deploy Schedule Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "scrape_gameatl.py"
      - "requirements.txt"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate schedule JSON
        run: python scrape_gameatl.py

      - name: Verify schedule JSON is non-empty
        run: |
          count=$(python -c "import json; data=json.load(open('public/schedule.json')); print(len(data))")
          echo "Schedule contains $count events."
          [ "$count" -gt 0 ] || { echo "ERROR: schedule.json is empty after scrape."; exit 1; }

      - name: Commit updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet public/schedule.json || (
            git add public/schedule.json &&
            git commit -m "chore: refresh schedule data [skip ci]"
          )
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
